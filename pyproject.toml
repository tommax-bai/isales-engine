[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isales-engine"
version = "0.1.0"
description = "Real-time call engine: state machine + 3-layer AI pipeline + realtime modules for the iSales platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "iSales" }]
dependencies = [
    "isales-common>=0.8.2,<0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "websockets>=12.0",
    "grpcio>=1.60",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-redis",
    "freezegun>=1.4",
]

[project.scripts]
isales-engine = "isales_engine.main:run"
isales-engine-mint-rtc-token = "isales_engine.cli.mint_rtc_token:main"

[tool.hatch.build.targets.wheel]
packages = ["isales_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "ASYNC",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# grpcio has no first-party type stubs (types-grpcio package is community-
# maintained and lags upstream). Treat the import surface as untyped.
module = ["grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated gRPC service stubs in isales-common don't carry type annotations
# on the bridge helpers; skip strict checks at their call sites here.
module = ["isales_common.proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# python-jose ships no first-party stubs; the JWT verify surface we use is
# narrow (encode/decode + JWTError) and we coerce return types explicitly.
module = ["jose", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
